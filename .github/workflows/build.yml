name: build

# Builds every target of the preview app. dev.fediim resolves from one place (settings.gradle.kts):
# while the pin is a snapshot, from mavenLocal after publishing anysdui-kmp at the pinned commit
# (needs secret ANYSDUI_SOURCE_TOKEN); once the pin is a release, from GitHub Packages (needs secret
# ANYSDUI_PACKAGES_TOKEN, a classic PAT with read:packages only). Neither token is ever echoed; each
# reaches a step only through env.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: build-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  android-desktop-web:
    name: Android, desktop, web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Read the AnySDUI pin
        id: pin
        run: |
          version="$(sed -n 's/^anysdui\.version=//p' gradle.properties)"
          commit="$(sed -n 's/^anysdui\.sourceCommit=//p' gradle.properties)"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          case "$version" in
            *-SNAPSHOT) echo "snapshot=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "snapshot=false" >> "$GITHUB_OUTPUT"; echo "ORG_GRADLE_PROJECT_anysduiRepository=githubPackages" >> "$GITHUB_ENV" ;;
          esac

      # Snapshot pin only: removed once a release exists.
      - name: Check out anysdui-kmp at the pinned commit
        if: steps.pin.outputs.snapshot == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: fediim-dev/anysdui-kmp
          ref: ${{ steps.pin.outputs.commit }}
          path: anysdui-kmp
          token: ${{ secrets.ANYSDUI_SOURCE_TOKEN }}
          persist-credentials: false

      - name: Publish AnySDUI to mavenLocal
        if: steps.pin.outputs.snapshot == 'true'
        working-directory: anysdui-kmp
        run: ./gradlew publishToMavenLocal --console=plain

      - name: Build and test
        run: >
          ./gradlew --console=plain
          :buildSrc:test :app:jvmTest :desktopApp:test :androidApp:assembleDebug :desktopApp:compileKotlin
          :webApp:wasmJsBrowserDistribution
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          ANYSDUI_PACKAGES_TOKEN: ${{ steps.pin.outputs.snapshot == 'false' && secrets.ANYSDUI_PACKAGES_TOKEN || '' }}

  ios:
    name: iOS
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Read the AnySDUI pin
        id: pin
        run: |
          version="$(sed -n 's/^anysdui\.version=//p' gradle.properties)"
          commit="$(sed -n 's/^anysdui\.sourceCommit=//p' gradle.properties)"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          case "$version" in
            *-SNAPSHOT) echo "snapshot=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "snapshot=false" >> "$GITHUB_OUTPUT"; echo "ORG_GRADLE_PROJECT_anysduiRepository=githubPackages" >> "$GITHUB_ENV" ;;
          esac

      # Snapshot pin only: removed once a release exists.
      - name: Check out anysdui-kmp at the pinned commit
        if: steps.pin.outputs.snapshot == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: fediim-dev/anysdui-kmp
          ref: ${{ steps.pin.outputs.commit }}
          path: anysdui-kmp
          token: ${{ secrets.ANYSDUI_SOURCE_TOKEN }}
          persist-credentials: false

      - name: Publish AnySDUI to mavenLocal
        if: steps.pin.outputs.snapshot == 'true'
        working-directory: anysdui-kmp
        run: ./gradlew publishToMavenLocal --console=plain

      - name: Link the iOS framework and write the Xcode configuration
        run: ./gradlew --console=plain :app:generateIosConfig :app:linkDebugFrameworkIosSimulatorArm64
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          ANYSDUI_PACKAGES_TOKEN: ${{ steps.pin.outputs.snapshot == 'false' && secrets.ANYSDUI_PACKAGES_TOKEN || '' }}

      - name: Build the iOS app for the simulator
        run: >
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Debug
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          ANYSDUI_PACKAGES_TOKEN: ${{ steps.pin.outputs.snapshot == 'false' && secrets.ANYSDUI_PACKAGES_TOKEN || '' }}
