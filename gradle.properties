#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx6144M
#Gradle
org.gradle.jvmargs=-Xmx8192M -XX:MaxMetaspaceSize=1024M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
ksp.useKSP2=true

# AnySDUI artifacts (dev.fediim). While no release exists the pin is the snapshot built from
# anysdui-kmp at sourceCommit by `./gradlew publishToMavenLocal`; the bump workflow rewrites both
# lines on a release.
anysdui.version=0.1.0-SNAPSHOT
anysdui.sourceCommit=9d1399b3d53317534cf90438921c05aabe0fb697

# The preview app. Replace these placeholders with your own values.
# The server the app joins rooms on: https://host[:port], or http://localhost / http://127.0.0.1
# for development only.
preview.serverOrigin=https://preview.example.com
# Android application id (Java package syntax).
preview.applicationId=com.example.anysduipreview
# Apple developer Team ID (10 upper-case letters and digits), needed to sign the iOS app.
preview.appleTeamId=ABCDE12345
# Optional client-side limits; unset means the transport's own defaults.
# preview.maxComponents=200
# preview.maxPayloadBytes=1048576
# preview.maxFrameBytes=1048576

# Your design system, compiled in (comma-separated lists, same order). Example with the sample
# design system that ships in designsystems/sample:
# designSystem.coordinates=:designsystems:sample
# designSystem.renderers=dev.fediim.anysdui.designsystem.anysdui.generated.SampleDesignsystemRenderer
# designSystem.catalogs=designsystems/sample/catalog.json
